[project]
name = "ComfyArt"
description = "A free, open-source AI design canvas that runs fully on your own ComfyUI"
version = "1.0.1"
license = {text = "MIT"}
dependencies = ["pypdfium2"]

[project.urls]
Repository = "https://github.com/jtydhr88/ComfyArt"

[tool.comfy]
PublisherId = "jtydhr88"
DisplayName = "Loomi"
Icon = ""
includes = ["dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "gate_skip(reason): known failure on clean main, excluded from scripts/gate.sh with a reason and an issue number (#712)",
]
